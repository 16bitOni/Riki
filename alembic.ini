[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# the database URL comes from app/config.py (DATABASE_URL), not from this file

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
