<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIKI//OBS — agent telemetry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Cpath d='M3 18h6l3-9 5 16 4-12 2 5h6' fill='none' stroke='%235dffa6' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Martian+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo">RIKI<b>//</b>OBS</div>
      <div class="sub"><span class="pulse" id="live"></span><span id="live-label">connecting</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div><kbd>1</kbd>–<kbd>0</kbd> switch page</div>
      <div><kbd>r</kbd> refresh</div>
      <div><kbd>/</kbd> search</div>
      <div><kbd>esc</kbd> close panel</div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="title">Overview</h1>
      <div class="spacer"></div>
      <div class="seg" id="range">
        <button data-h="0.25">15m</button><button data-h="1">1h</button><button data-h="6">6h</button><button data-h="24">24h</button><button data-h="72">3d</button><button data-h="168">7d</button><button data-h="720">30d</button>
      </div>
      <button class="tool-btn" id="refresh">⟳ every 15s</button>
      <button class="tool-btn" id="now" title="refresh now (r)">↻</button>
      <div class="clock" id="clock">--:--:--</div>
    </header>
    <main class="scroll" id="view"><div class="loading">acquiring signal</div></main>
  </div>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer">
  <header><h3 id="drawer-title">Detail</h3><div class="spacer" style="flex:1"></div><button class="x" id="drawer-x" aria-label="close">✕</button></header>
  <div class="body" id="drawer-body"></div>
</aside>

<div class="lock" id="lock">
  <div class="box">
    <h2>Access key</h2>
    <p>This server requires an API key to read telemetry. It is kept for this browser tab only.</p>
    <input class="in" id="lock-key" type="password" placeholder="X-API-Key" autocomplete="off">
    <button class="tool-btn" id="lock-go">unlock</button>
    <div class="err" id="lock-err"></div>
  </div>
</div>

<script src="viz.js"></script>
<script src="pages-a.js"></script>
<script src="pages-b.js"></script>
<script src="pages-c.js"></script>
<script src="app.js"></script>
</body>
</html>
