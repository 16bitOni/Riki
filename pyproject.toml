[project]
name = "personal-agent"
version = "0.1.0"
description = "Riki — a personal AI assistant with long-term memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "boto3>=1.35",
    "httpx>=0.27",
    "langgraph>=1.0,<2",
    "langgraph-supervisor>=0.0.29",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "langchain-aws>=1.0",
    "langchain-core>=1.0",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
desktop = [
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pillow>=10.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::langgraph.errors.LangGraphDeprecatedSinceV10",
]
# Eval tests use the real LLM and are slow. Run them explicitly:
#   uv run pytest tests/eval/ -v
# The default test run skips the eval/ subtree.
norecursedirs = ["tests/eval"]
markers = [
    "eval: real-LLM evaluation tests (slow, costs tokens)",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
